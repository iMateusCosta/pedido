<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contagem Regressiva - O Grande Pedido</title>
    <!-- Configurações para ícone na tela inicial (PWA) -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Nosso Sim">
    <link rel="manifest" href="manifest.json">
    
    <!-- Ícone de Atalho (Favicon básico) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💍</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #2c163b, #592e6e, #894b8b);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 35px 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .heart {
            font-size: 2.5rem;
            margin-bottom: 10px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        h1 {
            font-size: 1.3rem;
            margin-bottom: 25px;
            font-weight: 400;
            letter-spacing: 0.5px;
            color: #f3e5f5;
        }

        .countdown {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .time-box {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px 2px;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .time-box span {
            font-size: 1.6rem;
            font-weight: 700;
            color: #ffffff;
        }

        .time-box p {
            font-size: 0.65rem;
            text-transform: uppercase;
            margin-top: 6px;
            letter-spacing: 1px;
            opacity: 0.75;
        }

        .message {
            margin-top: 25px;
            font-size: 1.4rem;
            font-weight: 600;
            color: #ffd700;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="heart">💍</div>
        <h1>Contagem regressiva para o nosso 'Sim'</h1>
        
        <div class="countdown" id="countdown">
            <div class="time-box">
                <span id="days">00</span>
                <p>Dias</p>
            </div>
            <div class="time-box">
                <span id="hours">00</span>
                <p>Horas</p>
            </div>
            <div class="time-box">
                <span id="minutes">00</span>
                <p>Min</p>
            </div>
            <div class="time-box">
                <span id="seconds">00</span>
                <p>Seg</p>
            </div>
        </div>

        <div class="message" id="message" style="display: none;">Chegou o grande momento! Te amo ❤️</div>
    </div>

    <script>
        // Data alvo: 26 de novembro de 2026 às 00:00:00
        const targetDate = new Date("2026-11-26T00:00:00").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance < 0) {
                clearInterval(timerInterval);
                document.getElementById("countdown").style.display = "none";
                document.getElementById("message").style.display = "block";
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            // Atualiza os elementos no HTML com zero à esquerda se menor que 10
            document.getElementById("days").innerText = String(days).padStart(2, '0');
            document.getElementById("hours").innerText = String(hours).padStart(2, '0');
            document.getElementById("minutes").innerText = String(minutes).padStart(2, '0');
            document.getElementById("seconds").innerText = String(seconds).padStart(2, '0');
        }

        // Executa imediatamente e depois a cada segundo
        updateCountdown();
        const timerInterval = setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
